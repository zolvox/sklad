<head>

<title>Смена на штабелере</title>
<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0}
body{background:#0f1113;color:#eeece4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
form{width:100%;max-width:360px;background:#171a1d;border:1px solid rgba(236,232,220,.14);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.ey{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#f2b705}
h1{margin:0;font-size:24px;line-height:1.15}
p{margin:0;font-size:14px;color:#a6aaa2;line-height:1.45}
input[type=password]{font:inherit;font-size:16px;padding:11px 12px;border-radius:9px;border:1px solid rgba(236,232,220,.25);background:#0f1113;color:#eeece4}
input[type=password]:focus{outline:2px solid #f2b705;outline-offset:1px}
label.rm{display:flex;gap:8px;align-items:center;font-size:13px;color:#a6aaa2}
button{font:inherit;font-weight:600;font-size:16px;padding:11px 14px;border-radius:9px;border:0;background:#f2b705;color:#1d1704;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:#f0694a;font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="ey">Склад «Хвостико»</div>
  <h1>Смена на штабелере</h1>
  <p>Игра доступна по паролю.</p>
  <input id="pw" type="password" placeholder="Пароль" aria-label="Пароль" autofocus required>
  <label class="rm"><input id="rm" type="checkbox" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Открыть</button>
  <div class="err" id="err" role="alert"></div>
</form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){ const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.salt),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]); }
async function open(key){ const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},key,u8(D.ct)); const html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close(); }
(async()=>{ try{ const s=localStorage.getItem("sklad-key"); if(s){ const k=await crypto.subtle.importKey("raw",u8(s),"AES-GCM",false,["decrypt"]); await open(k); } }catch(e){ try{localStorage.removeItem("sklad-key");}catch(_){} } })();
document.getElementById("f").addEventListener("submit",async e=>{ e.preventDefault(); const btn=document.getElementById("go"), err=document.getElementById("err");
  btn.disabled=true; btn.textContent="Проверяю…"; err.textContent="";
  try{ const k=await keyFrom(document.getElementById("pw").value);
    if(document.getElementById("rm").checked){ try{ const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k)); localStorage.setItem("sklad-key",btoa(String.fromCharCode(...raw))); }catch(_){} }
    await open(k);
  }catch(x){ err.textContent="Неверный пароль. Проверь раскладку и попробуй ещё раз."; btn.disabled=false; btn.textContent="Открыть"; try{localStorage.removeItem("sklad-key");}catch(_){} }
});
